<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geri Sayım</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: depositphotos_208915272-stock-photo-idyllic-tropical-beach-sunset-landscape.jpg;
            font-family: 'Inter', sans-serif;
        }

        #timer {
            font-size: 4rem;
            font-weight: 600;
            background: #CFA173;
            background: repeating-linear-gradient(to bottom right, #CFA173 0%, #5F5FCF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }
    </style>
</head>
<body>

    <div id="timer">Yükleniyor...</div>

    <script>
        const targetDate = new Date("June 26, 2026 00:00:00").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("timer").innerHTML = 
                `${days}g ${hours}s ${minutes}d ${seconds}sn`;

            if (distance < 0) {
                clearInterval(interval);
                document.getElementById("timer").innerHTML = "Süre Doldu";
            }
        }

        const interval = setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
