<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>count when its fine..</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Kaydırma çubuğunu engeller */
        }

        /* Arka planı ayrı bir katmana aldık */
        .background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('depositphotos_208915272-stock-photo-idyllic-tropical-beach-sunset-landscape.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(50%); /* Buradaki değer ile karartmayı kontrol edebilirsiniz */
            z-index: -1; /* Yazının arkasında kalması için */
        }

        #timer {
            font-size: 6rem;
            font-weight: 600;
            letter-spacing: -2px;
            
            /* Gradient stil */
            background: #FFD753;
            background: linear-gradient(to right, #FFD753 0%, #8A96FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (max-width: 768px) {
            #timer {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>

    <div class="background-layer"></div>

    <div id="timer">loading..</div>

    <script>
        const targetDate = new Date("June 26, 2026 00:00:00").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("timer").innerHTML = 
                `${days} : ${hours} : ${minutes} : ${seconds}`;

            if (distance < 0) {
                clearInterval(interval);
                document.getElementById("timer").innerHTML = "Süre Doldu";
            }
        }

        const interval = setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
